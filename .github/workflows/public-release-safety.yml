name: Public release safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Audit public tree
        run: node scripts/public-release-audit.cjs
